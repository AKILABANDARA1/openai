openapi: 3.0.3

info:
  title: Publisher Token Proxy
  description: OpenAI-compatible OAuth2 token endpoint
  version: "1.0.0"

servers:
  - url: /

tags:
  - name: OAuth

paths:
  /oauth2/token:
    post:
      tags:
        - OAuth
      summary: Generate OAuth2 Access Token
      description: Issues an OAuth2 access token.
      operationId: generateAccessToken

      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grant_type
                - client_id
                - client_secret
              properties:
                grant_type:
                  type: string
                  example: client_credentials
                client_id:
                  type: string
                  example: my-client-id
                client_secret:
                  type: string
                  format: password
                  example: my-client-secret
                scope:
                  type: string
                  example: api.read

      responses:
        "200":
          description: Access token generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"

        "400":
          description: Invalid request

        "401":
          description: Unauthorized

        "500":
          description: Internal server error

components:
  schemas:
    AccessTokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          type: string
          example: eyJhbGciOi...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        scope:
          type: string

  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic

security:
  - BasicAuth: []
